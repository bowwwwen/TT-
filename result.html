<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analysis Result — TalenTag</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 淡入動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) }
      to   { opacity: 1; transform: translateY(0) }
    }
    .fade-in { animation: fadeIn 0.8s ease-out forwards; opacity: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- 慶祝 confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    window.onload = () => {
      confetti({ particleCount: 100, spread: 70 });
    };
  </script>

  <!-- 結果主區塊 -->
  <section class="pt-24 max-w-3xl mx-auto space-y-8">
    <div class="bg-white p-6 rounded-lg shadow-lg fade-in" style="animation-delay:0.2s">
      <h2 class="text-2xl font-bold mb-4">分析完成！</h2>
      <p>以下是您履歷的自動標籤：</p>
      <div id="tag-container" class="mt-4 flex flex-wrap gap-2">
        <!-- 範例：-->
        <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded">Python</span>
        <span class="px-3 py-1 bg-green-100 text-green-700 rounded">Machine Learning</span>
        <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded">UI/UX</span>
      </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-lg fade-in" style="animation-delay:0.4s">
      <h3 class="font-semibold mb-3">推薦職缺</h3>
      <div class="grid md:grid-cols-3 gap-4">
        <!-- 每張 Job Card -->
        <div class="p-4 bg-gray-100 rounded hover:shadow-lg transition">
          <h4 class="font-medium">前端工程師</h4>
          <p class="text-sm text-gray-600">XYZ Tech</p>
          <a href="#" class="mt-2 inline-block text-blue-500">查看詳情</a>
        </div>
        <!-- … -->
      </div>
    </div>

    <!-- Beta 表單、Footer…略 -->

  </section>

  <!-- 前端串接範例：動態渲染 tag-container -->
  <script>
    // 假設從 API 拿回 data.tags
    // document.getElementById('tag-container').innerHTML = data.tags
    //   .map(t => `<span class="px-3 py-1 bg-blue-100">${t.label}</span>`)
    //   .join('');
  </script>

</body>
</html>
